# config.yaml — multimodal adjustment for ICU treatment-effect estimation
# Single source of truth. main_causal.py reads only this file.
#
# Authored by Soroosh (values are fixed); the analyst sets only the machine paths
# below. Folded in from config_Soroosh.yaml on 2026-06-21. Path strings support
# ${ENV} / ${ENV:default} interpolation (resolved in src/cfg.py).

# ----------------------------------------------------------------------
paths:
  # outputs: all embeddings, intermediates, results live here (outside the repo, §0)
  storage_root: ${CTFM_STORAGE:/home/woody/iwi5/iwi5406h/ctfm_storage}
  uploads:      ${CTFM_DATASETS:/home/woody/iwi5/iwi5406h/New_Sp/Datasets}      # raw datasets
  outputs:      ${CTFM_STORAGE:/home/woody/iwi5/iwi5406h/ctfm_storage}/results

  # input sub-locations on this machine (reuse the existing link layer + event stream)
  data_dir:     ${CTFM_DATA:/home/woody/iwi5/iwi5406h/New_Sp/data}
  link_dir:     ${CTFM_DATA:/home/woody/iwi5/iwi5406h/New_Sp/data}/link
  event_stream: ${CTFM_DATA:/home/woody/iwi5/iwi5406h/New_Sp/data}/event_stream_clean
  mimic_dir:    ${CTFM_DATASETS:/home/woody/iwi5/iwi5406h/New_Sp/Datasets}/physionet.org/files/mimiciv/3.1
  cxr_master:   ${CTFM_DATASETS:/home/woody/iwi5/iwi5406h/New_Sp/Datasets}/mimic_master_list.csv
  cxr_images:   ${CTFM_DATASETS:/home/woody/iwi5/iwi5406h/New_Sp/Datasets}/preprocessed
  notes_dir:    ${CTFM_DATASETS:/home/woody/iwi5/iwi5406h/New_Sp/Datasets}/physionet.org/files/mimic-iv-note/2.2
  eicu_dir:     ${CTFM_DATASETS:/home/woody/iwi5/iwi5406h/New_Sp/Datasets}/physionet.org/files/eicu-crd/2.0
  external_cxr:                  # §3 image-embedding quality gate (RAD-DINO over external CXR sets)
    padchest:
      csv:         /home/hpc/iwi5/iwi5406h/fix10april/Project/padchest_trainval.csv
      images_root: /home/vault/iwi5/iwi5406h/preprocessed_Padchest
      id_col:      ImageID
      view_col:    view
      path:        "{images_root}/{ImageDir}/{ImageID}"
    chestxray14:
      csv:         ${CTFM_DATASETS:/home/woody/iwi5/iwi5406h/New_Sp/Datasets}/final_cxr14_master_list.csv
      images_root: ${CTFM_DATASETS:/home/woody/iwi5/iwi5406h/New_Sp/Datasets}/chestxray14/preprocessed
      id_col:      image_id
      view_col:    view_position
      path:        "{images_root}/{img_rel_path}"
    chexpert: null    # upload pending; add {csv, images_root, id_col, view_col, path} then re-run

  # storage subdirectories (created under storage_root)
  embeddings:  embeddings
  cohorts:     cohorts
  checkpoints: checkpoints
  results:     results

# ----------------------------------------------------------------------
run:
  seed: 42
  effect_measure: risk_difference      # active arm minus comparator
  effect_scale: percentage_points
  effect_decimals: 1
  multiple_testing: benjamini_hochberg

bootstrap:
  n_resamples: 10000
  unit: patient                        # patient-level cluster bootstrap
  reuse_indices_across_conditions: true

# ----------------------------------------------------------------------
dataset_versions:                      # pin exactly; record in manifest.csv
  mimic_iv: "3.1"
  mimic_iv_ed: "2.2"
  mimic_iv_note: "2.2"
  mimic_cxr_jpg: "2.1.0"
  eicu_crd: "2.0"
  chexpert: "snapshot_in_house"
  chestxray14: "snapshot_in_house"
  padchest: "snapshot_in_house"

# ----------------------------------------------------------------------
images:
  encoder: rad-dino
  size: 224
  views: [PA, AP, AP_erect, AP_supine]   # frontal only; lateral dropped
  resize_once_to_storage: true

text:
  encoder: clinical-longformer
  max_tokens: 4096
  variants:
    notes_clinical: { exclude_radiology_reports: true }   # default note modality
    notes_all:      { exclude_radiology_reports: false }  # used only in decomposition

pooling:
  rule: mean
  look_back_window_hours: 48           # only pre-time-zero data within this window

# ----------------------------------------------------------------------
estimator:
  method: aipw                         # cross-fitted AIPW everywhere
  nuisance_model: lightgbm
  cross_fitting_folds: 5

conditions: [naive, structured, plus_notes, plus_imaging_only, full, design_based]

robustness_swaps:
  encoder_alt: biomedclip
  estimator_alt: tmle
  look_back_window_alt_hours: 24
  pooling_alt: max

# ----------------------------------------------------------------------
demographics:
  age_at: time_zero
  drop_age_empty_or_zero: true
  age_bands: ["(0,40]", "(40,55]", "(55,70]", "(70,120]"]   # right-inclusive, left-exclusive
  sex_levels: [F, M]
  mimic_age_over_89_anchor_note: "MIMIC-IV shifts ages >89 to a single anchor; top band absorbs it"

# ----------------------------------------------------------------------
# INTERVENTIONS
# Each: eligibility, time_zero, the two arms, outcome+horizon, negative control,
# the RCT reference (active minus comparator, percentage points), and the
# expert structured confounder set used by the design_based condition.
# ----------------------------------------------------------------------
interventions:

  prone_positioning:
    role: positive_control
    eligibility:
      ards_severe: true
      pao2_fio2_lt: 150
      fio2_ge: 0.6
      peep_ge: 5
      invasive_ventilation: true
      within_hours_of_intubation: 36
    time_zero: first_qualifying_severe_hypoxemia_in_icu
    arms:
      active: prone_session_initiated_within_24h
      comparator: remained_supine
    outcome: all_cause_mortality
    horizon_days: 28
    negative_control_outcome: icu_acquired_uti
    imaging_confounder_label: edema          # MIMIC-CXR-JPG label for the validity probe
    rct_reference:
      source: PROSEVA
      risk_difference: -16.8
      ci: [-24.5, -9.1]
      horizon_days: 28
      target_type: nonzero
    expert_confounders: [age, sex, bmi, sofa_total, pao2_fio2, peep, fio2, plateau_pressure,
      vasopressor_dose, lactate, creatinine, gcs, hours_since_intubation, immunosuppression]

  fluids_sepsis:
    role: null_calibration_imaging
    eligibility:
      suspected_infection: true
      sepsis_induced_hypotension: true       # SBP<100 after >=1L crystalloid, or vasopressor
      within_hours_of_icu_admit: 24
    time_zero: onset_sepsis_induced_hypotension
    arms:
      active: restrictive_fluids             # <30 ml/kg crystalloid in 24h OR vasopressor before 30 ml/kg
      comparator: liberal_fluids
    outcome: all_cause_mortality
    horizon_days: 90
    negative_control_outcome: icu_acquired_uti
    imaging_confounder_label: edema          # pulmonary edema is the latent confounder here
    rct_reference:
      source: [CLOVERS, CLASSIC]             # both 90-day, both null -> fixed-effect meta-analytic
      risk_difference: -0.5                   # verified: CLOVERS -0.9 (14.0 vs 14.9), CLASSIC +0.2 (42.3 vs 42.1)
      ci: [-3.4, 2.3]                         # fixed-effect inverse-variance meta of the two
      horizon_days: 90
      target_type: null
    expert_confounders: [age, sex, sofa_total, lactate, mean_arterial_pressure, vasopressor_dose,
      creatinine, urine_output_6h, crystalloid_volume_pre_t0, heart_failure_history, ckd_history,
      infection_source]

  rrt_timing:
    role: null_calibration_notes
    eligibility:
      aki_kdigo_stage_in: [2, 3]
      no_urgent_rrt_indication: true         # no severe hyperkalemia/acidosis/uremia/overload
      in_icu: true
    time_zero: first_kdigo_stage2_3_without_urgent_indication
    arms:
      active: accelerated_rrt_within_12h
      comparator: standard_delayed_rrt
    outcome: all_cause_mortality
    horizon_days: 90
    negative_control_outcome: icu_acquired_uti
    notes_confounder: clinician_urgency_and_trajectory_gestalt
    rct_reference:
      source: STARRT-AKI
      risk_difference: 0.2
      ci: [-3.1, 3.9]                        # from RR 1.00 (0.93-1.09) at ~43.7% baseline
      horizon_days: 90
      target_type: null
    expert_confounders: [age, sex, sofa_total, creatinine, bun, potassium, urine_output_6h,
      bicarbonate, ph, fluid_balance_cumulative, vasopressor_use, ckd_history, mechanical_ventilation]

  transfusion_threshold:
    role: null_calibration_structured_anchor
    eligibility:
      septic_shock: true
      hemoglobin_lt: 9.0
      in_icu: true
    time_zero: first_hemoglobin_lt_9_in_septic_shock
    arms:
      active: restrictive_transfuse_at_hb_le_7
      comparator: liberal_transfuse_at_hb_le_9
    outcome: all_cause_mortality
    horizon_days: 90
    negative_control_outcome: icu_acquired_uti
    structured_confounder: hemoglobin        # key confounder is structured -> imaging should not help
    rct_reference:
      source: TRISS                          # primary; horizon and population match
      risk_difference: -2.0
      ci: [-9.9, 4.1]                        # from RR 0.94 (0.78-1.09) at 45% baseline
      horizon_days: 90
      target_type: null
      sensitivity_reference:                 # different horizon/population -> not pooled, sensitivity only
        source: TRICC
        risk_difference: -4.6
        ci: [-10.2, 0.8]
        horizon_days: 30
    expert_confounders: [age, sex, hemoglobin, sofa_total, lactate, coronary_artery_disease,
      active_bleeding, platelets, vasopressor_use, creatinine]

# ----------------------------------------------------------------------
external:
  dataset: eicu_crd
  conditions: [structured, plus_notes]       # no imaging available externally

# ----------------------------------------------------------------------
# §3 image-embedding QUALITY GATE (a check, not a result): does RAD-DINO
# separate known findings on EXTERNAL chest-X-ray datasets? These never enter
# the causal models. Machine paths set by the analyst. CheXpert added when uploaded.
quality_gate:
  sample_per_dataset: 30000                   # gate, not a result -> a sample suffices
  probe_labels: [edema, effusion, cardiomegaly]
  datasets:
    padchest:
      images: /home/vault/iwi5/iwi5406h/preprocessed_Padchest
      master: /home/hpc/iwi5/iwi5406h/fix10april/Project/padchest_trainval.csv
      path_cols: [ImageDir, ImageID]          # abs path = images/ImageDir/ImageID
      view_col: view
      label_map: {edema: pulmonary_edema, effusion: pleural_effusion, cardiomegaly: cardiomegaly}
    chestxray14:
      images: ${CTFM_DATASETS:/home/woody/iwi5/iwi5406h/New_Sp/Datasets}/chestxray14/preprocessed
      master: ${CTFM_DATASETS:/home/woody/iwi5/iwi5406h/New_Sp/Datasets}/final_cxr14_master_list.csv
      path_col: img_rel_path                  # abs path = images/img_rel_path
      view_col: view_position
      label_map: {edema: edema, effusion: effusion, cardiomegaly: cardiomegaly}
