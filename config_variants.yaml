# config_variants.yaml -- SENSITIVITY variants (analyst-owned; not the main run).
#
# The main run uses config.yaml as-is: embedding_reduction=score (decision 4,
# Soroosh-approved) -> results/. These variants override the reduction + output dir
# for the reported sensitivity / failure cases:
#   python main_causal.py --stage <stage> --variant raw   # raw embeddings (failure case)
#   python main_causal.py --stage <stage> --variant pca   # PCA-k sensitivity
#
variants:
  # Raw 1,536-dim embeddings -> breaks overlap. Kept as a REPORTED failure case
  # (the negative control catching it is a real finding; §5 / decision 4).
  raw:
    reduction: none
    results_dir: results_raw
  # PCA to a fixed small k per modality -- reported as a sensitivity for decision 4.
  pca:
    reduction: pca
    pca_components: 30
    results_dir: results_pca
